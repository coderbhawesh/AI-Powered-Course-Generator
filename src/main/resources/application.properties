spring.application.name=hackathon
spring.config.import=optional:classpath:application-secrets.properties

# Load secrets from environment variables for safe public deployment.
gemini.api.key=${GEMINI_API_KEY:}
youtube.api.key=${YOUTUBE_API_KEY:}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:${MONGO_URL:${MONGO_URI:}}}}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:${MONGODB_DATABASE:}}
app.mongodb.ping-on-startup=${APP_MONGODB_PING_ON_STARTUP:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL:${CORS_ALLOWED_ORIGINS:}}}
logging.level.root=INFO
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:}
jwt.secret=${JWT_SECRET:change-me-before-production}
jwt.expiration=86400000
server.port=${PORT:8080}
